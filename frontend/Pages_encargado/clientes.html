<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>
    <link rel="stylesheet" href="../../css/encargado-css/clientes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <!-- NAVBAR -->
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-brand">
            <div class="nav-logo">
                <span class="nav-gear">⚙️</span>
            </div>
            <span class="app-name">MecApp</span>
        </div>
        <div class="nav-menu">
            <a href="./dashboard-encargado.html" class="nav-link">Inicio</a>
            <a href="./clientes.html" class="nav-link active">Clientes</a>
            <a href="./vehiculos.html" class="nav-link">Vehículos</a>
            <a href="./citas.html" class="nav-link">Citas</a>
        </div>
        <div class="nav-user">
            <button id="btnRegisterEmpleado" style="margin-right: 10px; cursor: pointer; padding: 6px 12px; background: #3B82F6; color: white; border: none; border-radius: 4px;">Registrar empleado</button>
            <span class="user-name">Encargado</span>
            <div class="user-avatar">E</div>
            <button id="btnLogout" style="margin-left: 10px; cursor: pointer; padding: 6px 12px; background: #EF4444; color: white; border: none; border-radius: 4px;">Salir</button>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container">
        <div class="page-title">
            <h1>Gestión de Clientes</h1>
        </div>

        <div class="card">
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Filas de clientes se cargarán aquí dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div id="client-modal" class="modal">
        <div id="client-modal-overlay" class="modal-overlay"></div>
        <div class="modal-dialog">
            <button id="client-modal-close" class="modal-close">×</button>
            <div id="client-modal-content" class="modal-content">
                <!-- Contenido dinámico se carga aquí -->
            </div>
        </div>
    </div>
    
    <!-- Script para actualizar header del encargado -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('=== PÁGINA CLIENTES CARGADA ===');
            
            // Verificar que el usuario sea ENCARGADO
            const tipoUsuario = localStorage.getItem('userType');
            const encargadoEmail = localStorage.getItem('encargadoEmail');
            
            if (tipoUsuario !== 'encargado' || !encargadoEmail) {
                console.log('Acceso denegado. No es encargado. Redirigiendo al login...');
                alert('Acceso denegado. Debe ser un encargado para acceder.');
                localStorage.clear();
                window.location.href = '/MecApp/frontend/login.html';
                return;
            }
            
            // Actualizar datos del encargado en el header
            try {
                const encargadoNombre = localStorage.getItem('encargadoNombre') || 'Encargado';
                
                const userNameElement = document.querySelector('.user-name');
                if (userNameElement) {
                    userNameElement.textContent = encargadoNombre;
                }
                
                const userAvatarElement = document.querySelector('.user-avatar');
                if (userAvatarElement) {
                    const primeraLetra = encargadoNombre.charAt(0).toUpperCase();
                    userAvatarElement.textContent = primeraLetra;
                }
                
                console.log('Header encargado actualizado:', encargadoNombre);
            } catch (error) {
                console.error('Error al actualizar header:', error);
            }
            
            // Configurar botón de logout
            const btnLogout = document.getElementById('btnLogout');
            if (btnLogout) {
                btnLogout.addEventListener('click', () => {
                    console.log('Cerrando sesión de encargado...');
                    localStorage.clear();
                    window.location.href = '/MecApp/frontend/login.html';
                });
            }
        });
    </script>

    <!-- MODAL REGISTRAR EMPLEADO -->
    <div id="register-empleado-modal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-dialog">
            <button class="modal-close" id="register-empleado-close">×</button>
            <div class="modal-content">
                <h3>Registrar Nuevo Empleado</h3>
                <form id="register-empleado-form">
                    <div class="form-group">
                        <label for="empleado-nombre">Nombre *</label>
                        <input type="text" id="empleado-nombre" required placeholder="Nombre completo">
                    </div>
                    <div class="form-group">
                        <label for="empleado-email">Email *</label>
                        <input type="email" id="empleado-email" required placeholder="correo@ejemplo.com">
                    </div>
                    <div class="form-group">
                        <label for="empleado-contrasena">Contraseña *</label>
                        <input type="password" id="empleado-contrasena" required placeholder="Contraseña">
                    </div>
                    <div class="form-group">
                        <label for="empleado-rol">Rol *</label>
                        <select id="empleado-rol" required>
                            <option value="">Seleccionar rol</option>
                            <option value="encargado">Encargado</option>
                            <option value="mecanico">Mecánico</option>
                            <option value="administrador">Administrador</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="empleado-disponible">
                            <input type="checkbox" id="empleado-disponible" checked>
                            Disponible
                        </label>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn-secondary" id="cancel-empleado">Cancelar</button>
                        <button type="submit" class="btn-primary">Registrar Empleado</button>
                    </div>
                </form>
                <div id="empleado-message" style="margin-top: 15px; display: none; padding: 10px; border-radius: 4px;"></div>
            </div>
        </div>
    </div>

    <script src="../../js/registro-empleado-modal.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            configurarRegistroEmpleado();
        });
    </script>
    <script src="../../js/cliente.js"></script>

</body>

</html>
