<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MecApp</title>
    <link rel="stylesheet" href="../../css/encargado-css/dashboard.css">
</head>

<body>
    <!-- Header/Navbar -->
    <header class="navbar">
        <div class="nav-brand">
            <div class="nav-logo">
                <div class="nav-gear">⚙</div>
                <div class="nav-wrench">🔧</div>
            </div>
            <span class="app-name">MecApp</span>
        </div>
        <nav class="nav-menu">
            <a href="./dashboard-encargado.html" class="nav-link active">Inicio</a>
            <a href="./clientes.html" class="nav-link">Clientes</a>
            <a href="./vehiculos.html" class="nav-link">Vehículos</a>
            <a href="./citas.html" class="nav-link">Citas</a>
        </nav>
        <div class="nav-user">
            <button id="btnRegisterEmpleado" style="margin-right: 10px; cursor: pointer; padding: 6px 12px; background: #3B82F6; color: white; border: none; border-radius: 4px;">Registrar empleado</button>
            <span class="user-name">Encargado</span>
            <div class="user-avatar">U</div>
            <button id="btnLogout" style="margin-left: 10px; cursor: pointer; padding: 6px 12px; background: #EF4444; color: white; border: none; border-radius: 4px;">Salir</button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="dashboard">
        <div class="container">
            <!-- Bienvenida -->
            <section class="welcome-section">
                <h1>Bienvenido a MecApp</h1>
                <p>Gestiona tu taller mecánico de manera eficiente</p>
            </section>

            <!-- Estadísticas Rápidas -->
            <section class="stats-grid">
                <div class="stat-card">
                    <h3>Citas Hoy</h3>
                    <p class="stat-number">5</p>
                </div>
                <div class="stat-card">
                    <h3>Clientes Activos</h3>
                    <p class="stat-number">24</p>
                </div>
                <div class="stat-card">
                    <h3>Vehículos en Taller</h3>
                    <p class="stat-number">3</p>
                </div>
                <div class="stat-card">
                    <h3>Ingresos Mensuales</h3>
                    <p class="stat-number">$2,450</p>
                </div>
            </section>

            <!-- Citas Pendientes -->
            <section class="pending-section">
                <h2>Citas Pendientes</h2>
                <div class="appointments-list">
                    <!-- Las citas se cargan con JavaScript -->
                </div>
            </section>
        </div>
    </main>

    <!-- MODAL REGISTRAR EMPLEADO -->
    <div id="register-empleado-modal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-dialog">
            <button class="modal-close" id="register-empleado-close">×</button>
            <div class="modal-content">
                <h3>Registrar Nuevo Empleado</h3>
                <form id="register-empleado-form">
                    <div class="form-group">
                        <label for="empleado-nombre">Nombre *</label>
                        <input type="text" id="empleado-nombre" required placeholder="Nombre completo">
                    </div>

                    <div class="form-group">
                        <label for="empleado-email">Email *</label>
                        <input type="email" id="empleado-email" required placeholder="correo@ejemplo.com">
                    </div>

                    <div class="form-group">
                        <label for="empleado-contrasena">Contraseña *</label>
                        <input type="password" id="empleado-contrasena" required placeholder="Contraseña">
                    </div>

                    <div class="form-group">
                        <label for="empleado-rol">Rol *</label>
                        <select id="empleado-rol" required>
                            <option value="encargado" selected>Mecánico</option>
                        </select>
                    </div>

                    <div class="form-group checkbox-group">
                        <label for="empleado-disponible">
                            <input type="checkbox" id="empleado-disponible" checked>
                            Disponible
                        </label>
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="btn-secondary" id="cancel-empleado">Cancelar</button>
                        <button type="submit" class="btn-primary">Registrar Empleado</button>
                    </div>
                </form>
                <div id="empleado-message" style="margin-top: 15px; display: none; padding: 10px; border-radius: 4px;"></div>
            </div>
        </div>
    </div>

    <!-- use relative path so script loads correctly whether served or opened as file -->
    <script src="../../js/dashboard.js"></script>
</body>

</html>
